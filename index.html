<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alu Romero Atelier — La poésie du métal</title>
<meta name="description" content="Alu Romero, artiste mexicaine à Montréal. Œuvres en étain repoussé à la main : cœurs sacrés, corps, fleurs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,560;1,9..144,420;1,9..144,480&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#CCC2A9; --sand-deep:#BFB399; --sand-light:#D9D1BB;
    --ink:#141210; --ink-soft:#463F32;
    --oxblood:#7C231D;
    --line:rgba(20,18,16,0.16); --line-strong:rgba(20,18,16,0.34);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--sand);color:var(--ink);font-family:'Work Sans',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;}
  ::selection{background:var(--ink);color:var(--sand);}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,64px);}
  .eyebrow{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.22em;font-size:0.7rem;color:var(--oxblood);display:flex;align-items:center;gap:12px;}
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--oxblood);display:inline-block;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:480;color:var(--ink);letter-spacing:-0.01em;line-height:1.08;}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px clamp(20px,5vw,64px);display:flex;justify-content:space-between;align-items:center;background:var(--sand);border-bottom:1px solid var(--line);transition:padding .5s;}
  nav.scrolled{padding:12px clamp(20px,5vw,64px);}
  .brand{display:flex;align-items:center;gap:12px;font-family:'Space Mono',monospace;}
  .brand img{width:34px;height:auto;}
  .brand b{font-weight:400;font-size:0.95rem;letter-spacing:0.04em;display:block;line-height:1.1;}
  .brand span{display:block;font-size:0.56rem;letter-spacing:0.32em;color:var(--ink-soft);margin-top:3px;text-transform:uppercase;}
  .navright{display:flex;align-items:center;gap:clamp(18px,3vw,40px);}
  .navlinks{display:flex;gap:clamp(18px,3vw,40px);font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;}
  .navlinks a{position:relative;padding-bottom:4px;color:var(--ink-soft);transition:color .3s;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--ink);transition:right .35s;}
  .navlinks a:hover::after{right:0;}
  @media (max-width:720px){.navlinks{display:none;}}

  .lang{display:flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px;font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;}
  .lang button{background:none;border:0;color:var(--ink-soft);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:inherit;transition:background .3s,color .3s;}
  .lang button:hover{color:var(--ink);}
  .lang button.on{background:var(--ink);color:var(--sand);}
  .lang button:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px;}

  /* HERO — split */
  .hero{position:relative;min-height:100svh;display:grid;grid-template-columns:1fr 1.15fr;align-items:stretch;padding-top:74px;}
  .hero-content{padding:clamp(48px,8vh,100px) clamp(20px,5vw,64px) clamp(48px,7vw,80px);display:flex;flex-direction:column;justify-content:flex-end;opacity:0;animation:riseIn 1.2s ease-out .3s forwards;}
  @keyframes riseIn{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
  .hero-content .eyebrow{margin-bottom:22px;}
  .hero-content h1{font-size:clamp(2.8rem,6.6vw,6rem);line-height:0.98;max-width:12ch;}
  .hero-content h1 em{font-style:italic;color:var(--oxblood);font-weight:420;}
  .hero-sub{margin-top:26px;max-width:40ch;font-size:clamp(0.95rem,1.3vw,1.1rem);color:var(--ink-soft);}
  .hero-mark{width:clamp(56px,6vw,84px);height:auto;margin-bottom:auto;opacity:.9;}
  .hero-img{position:relative;overflow:hidden;background:#000;min-height:52vh;}
  .hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 45%;transform:scale(1.04);animation:heroIn 2.2s ease-out forwards;}
  @keyframes heroIn{from{transform:scale(1.12);opacity:0;}to{transform:scale(1.04);opacity:1;}}
  .scroll-cue{position:absolute;left:clamp(20px,5vw,64px);bottom:34px;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.2em;color:var(--ink-soft);display:flex;align-items:center;gap:12px;opacity:0;animation:fadeIn 1s ease 1.4s forwards;}
  .scroll-cue .stem{width:44px;height:1px;background:var(--line-strong);position:relative;overflow:hidden;}
  .scroll-cue .stem::after{content:"";position:absolute;left:-100%;top:0;height:100%;width:100%;background:var(--oxblood);animation:stemMove 2.4s ease-in-out infinite;}
  @keyframes stemMove{0%{left:-100%;}60%{left:100%;}100%{left:100%;}}
  @keyframes fadeIn{to{opacity:1;}}
  @media (max-width:860px){.hero{grid-template-columns:1fr;min-height:auto;}.hero-content{padding-top:36px;padding-bottom:56px;order:2;justify-content:flex-start;}.hero-mark{margin-bottom:28px;}.hero-content .eyebrow{margin-bottom:16px;}.hero-img{order:1;min-height:56vh;}.scroll-cue{display:none;}}

  /* STATEMENT */
  .statement{padding:clamp(90px,14vw,160px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;}
  .statement blockquote{font-family:'Fraunces',serif;font-style:italic;font-weight:420;font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.42;max-width:22ch;margin:0 auto;}
  .statement blockquote span{color:var(--oxblood);}
  .statement cite{display:block;margin-top:28px;font-family:'Space Mono',monospace;font-style:normal;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}

  .section-head{padding-top:clamp(90px,12vw,140px);margin-bottom:clamp(48px,6vw,72px);}
  .section-head h2{font-size:clamp(2rem,4.4vw,3.4rem);margin-top:18px;max-width:16ch;}
  .section-head p{margin-top:20px;max-width:54ch;color:var(--ink-soft);font-size:1.02rem;}
  .hint{margin-top:18px;font-family:'Space Mono',monospace;font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--oxblood);}

  /* GALLERY */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:dense;gap:clamp(10px,1.6vw,22px);padding-bottom:clamp(90px,12vw,140px);}
  .piece{position:relative;overflow:hidden;background:var(--sand-deep);aspect-ratio:3/4;cursor:pointer;opacity:0;transform:translateY(30px) scale(.97);filter:grayscale(55%) contrast(.92);transition:opacity 1s cubic-bezier(.16,.8,.24,1),transform 1s cubic-bezier(.16,.8,.24,1),filter 1.3s ease;}
  .piece.wide{grid-column:span 2;aspect-ratio:16/10;}
  .piece.is-visible{opacity:1;transform:none;filter:none;}
  .piece img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease,transform 1.2s cubic-bezier(.16,.8,.24,1);}
  .piece img.room{opacity:0;}
  .piece.in-situ img.room{opacity:1;}
  .piece.in-situ img.art{transform:scale(1.04);}
  .piece .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,16,0) 50%,rgba(20,18,16,0.88) 100%);opacity:0;transition:opacity .5s;}
  .piece.in-situ .scrim,.piece:hover .scrim{opacity:1;}
  .piece .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 22px;transform:translateY(14px);opacity:0;transition:transform .5s,opacity .5s;color:var(--sand-light);}
  .piece.in-situ .cap,.piece:hover .cap{transform:none;opacity:1;}
  .piece .cap .title{font-family:'Fraunces',serif;font-style:italic;font-size:1.2rem;}
  .piece .cap .meta{font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.08em;color:rgba(217,209,187,.7);text-transform:uppercase;margin-top:6px;}
  .hallmark{position:absolute;top:16px;right:16px;z-index:2;width:44px;height:44px;border-radius:50%;background:var(--sand);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:0.58rem;font-weight:700;color:var(--ink);opacity:0;transform:scale(.6) rotate(-14deg);transition:opacity .45s ease .05s,transform .5s cubic-bezier(.34,1.56,.64,1) .05s;}
  .piece.in-situ .hallmark,.piece:hover .hallmark{opacity:1;transform:none;}
  @media (max-width:720px){.gallery{grid-template-columns:1fr 1fr;}}
  @media (max-width:460px){.gallery{grid-template-columns:1fr;}.piece.wide{grid-column:span 1;aspect-ratio:4/3;}}

  /* PROCESS */
  .process{background:var(--sand-deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(90px,12vw,140px) 0;}
  .process-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(40px,6vw,90px);align-items:start;}
  @media (max-width:860px){.process-grid{grid-template-columns:1fr;}}
  .process h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-top:16px;max-width:16ch;}
  .process p{color:var(--ink-soft);margin-top:22px;font-size:1rem;max-width:54ch;}
  .process p+p{margin-top:16px;}
  .tools{margin-top:34px;display:flex;flex-direction:column;gap:14px;}
  .tools .tool{display:flex;gap:16px;align-items:baseline;padding-bottom:14px;border-bottom:1px solid var(--line);font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--ink-soft);}
  .tools .tool b{color:var(--ink);font-weight:400;min-width:130px;display:inline-block;}
  .texture-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .texture-grid .tx{overflow:hidden;aspect-ratio:1/1;background:var(--ink);}
  .texture-grid .tx img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s;}
  .texture-grid .tx:hover img{transform:scale(1.12);}

  /* ABOUT */
  .about{padding:clamp(90px,12vw,150px) 0;}
  .about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(40px,6vw,90px);align-items:center;}
  @media (max-width:860px){.about-grid{grid-template-columns:1fr;}}
  .about h2{font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.08;}
  .about-copy p{color:var(--ink-soft);font-size:1.03rem;margin-top:18px;}
  .about-copy .quote{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);font-style:italic;font-family:'Fraunces',serif;color:var(--ink);font-size:1.05rem;}

  /* COMMISSIONS — inverted block */
  .commissions{background:var(--ink);color:var(--sand-light);padding:clamp(80px,10vw,120px) 0;}
  .commissions h2,.commissions h3{color:var(--sand-light);}
  .commissions .section-head p{color:rgba(217,209,187,.72);}
  .commissions .eyebrow{color:var(--sand);}
  .commissions .eyebrow::before{background:var(--sand);}
  .comm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,4vw,50px);margin-top:clamp(40px,6vw,60px);}
  @media (max-width:760px){.comm-grid{grid-template-columns:1fr;}}
  .comm-card .num{font-family:'Space Mono',monospace;font-size:0.72rem;color:var(--sand);letter-spacing:.1em;}
  .comm-card h3{font-size:1.3rem;margin-top:14px;font-weight:460;}
  .comm-card p{color:rgba(217,209,187,.72);margin-top:12px;font-size:.95rem;}

  /* CONTACT */
  .contact{padding:clamp(100px,14vw,170px) 0 clamp(50px,6vw,70px);}
  .contact-top{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap;}
  .contact h2{font-size:clamp(2.2rem,6vw,4.6rem);max-width:14ch;}
  .contact-logo{width:clamp(120px,14vw,190px);height:auto;opacity:.92;}
  .contact-row{margin-top:clamp(40px,5vw,60px);display:flex;flex-wrap:wrap;gap:clamp(30px,6vw,90px);padding-bottom:clamp(60px,8vw,90px);border-bottom:1px solid var(--line);}
  .contact-item .eyebrow{margin-bottom:14px;}
  .contact-item .big{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(1.2rem,2.4vw,1.7rem);border-bottom:1px solid var(--line-strong);padding-bottom:6px;display:inline-block;transition:color .3s,border-color .3s;}
  .contact-item a.big:hover{color:var(--oxblood);border-color:var(--oxblood);}
  footer{padding-top:30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s;}
  .reveal.is-visible{opacity:1;transform:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.piece,.reveal,.hero-content,.scroll-cue{opacity:1!important;transform:none!important;filter:none!important;}}
</style>
</head>
<body>

<nav id="nav">
  <a class="brand" href="#top">
    <img src="images/logo-mark.png" alt="Alu Romero Atelier">
    <div><b>alu romero</b><span>atelier · Montréal</span></div>
  </a>
  <div class="navright">
    <div class="navlinks">
      <a href="#work" data-i18n="nav.work"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </div>
    <div class="lang" role="group" aria-label="Langue / Idioma">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-content">
    <img class="hero-mark" src="images/logo-mark.png" alt="">
    <div class="eyebrow" data-i18n="hero.eyebrow"></div>
    <h1 data-i18n-html="hero.title"></h1>
    <p class="hero-sub" data-i18n="hero.sub"></p>
  </div>
  <div class="hero-img">
    <img src="images/hero.jpg" alt="" data-i18n-alt="hero.alt">
  </div>
  <div class="scroll-cue"><span class="stem"></span><span data-i18n="hero.scroll"></span></div>
</header>

<main>
<section class="statement">
  <div class="wrap">
    <blockquote data-i18n-html="statement.quote"></blockquote>
    <cite data-i18n="statement.cite"></cite>
  </div>
</section>

<section id="work" class="wrap">
  <div class="section-head reveal">
    <div class="eyebrow" data-i18n="work.eyebrow"></div>
    <h2 data-i18n="work.title"></h2>
    <p data-i18n="work.p"></p>
    <div class="hint" data-i18n="work.hint"></div>
  </div>
  <div class="gallery" id="gallery"></div>
</section>

<section id="process" class="process">
  <div class="wrap process-grid">
    <div class="reveal">
      <div class="eyebrow" data-i18n="process.eyebrow"></div>
      <h2 data-i18n="process.title"></h2>
      <p data-i18n="process.p1"></p>
      <p data-i18n="process.p2"></p>
      <div class="tools">
        <div class="tool"><b>Buril</b><span data-i18n="tools.buril"></span></div>
        <div class="tool"><b>Perfilador</b><span data-i18n="tools.perfilador"></span></div>
        <div class="tool"><b>Esfumino</b><span data-i18n="tools.esfumino"></span></div>
        <div class="tool"><b data-i18n="tools.wood_k"></b><span data-i18n="tools.wood"></span></div>
      </div>
    </div>
    <div class="texture-grid reveal">
      <div class="tx"><img src="images/tx1.jpg" alt="" loading="lazy"></div>
      <div class="tx"><img src="images/tx2.jpg" alt="" loading="lazy"></div>
      <div class="tx"><img src="images/tx3.jpg" alt="" loading="lazy"></div>
      <div class="tx"><img src="images/tx4.jpg" alt="" loading="lazy"></div>
    </div>
  </div>
</section>

<section id="about" class="about">
  <div class="wrap about-grid">
    <div class="reveal">
      <div class="eyebrow" data-i18n="about.eyebrow"></div>
      <h2 data-i18n="about.title"></h2>
    </div>
    <div class="about-copy reveal">
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
      <p class="quote" data-i18n="about.quote"></p>
    </div>
  </div>
</section>

<section class="commissions">
  <div class="wrap">
    <div class="section-head reveal" style="padding-top:0;">
      <div class="eyebrow" data-i18n="comm.eyebrow"></div>
      <h2 data-i18n="comm.title"></h2>
      <p data-i18n="comm.p"></p>
    </div>
    <div class="comm-grid reveal">
      <div class="comm-card"><div class="num">01</div><h3 data-i18n="comm.c1t"></h3><p data-i18n="comm.c1p"></p></div>
      <div class="comm-card"><div class="num">02</div><h3 data-i18n="comm.c2t"></h3><p data-i18n="comm.c2p"></p></div>
      <div class="comm-card"><div class="num">03</div><h3 data-i18n="comm.c3t"></h3><p data-i18n="comm.c3p"></p></div>
    </div>
  </div>
</section>

</main>

<section id="contact" class="contact">
  <div class="wrap">
    <div class="contact-top reveal">
      <div>
        <div class="eyebrow" data-i18n="contact.eyebrow"></div>
        <h2 data-i18n="contact.title"></h2>
      </div>
      <img class="contact-logo" src="images/logo-full.png" alt="Alu Romero Atelier">
    </div>
    <div class="contact-row reveal">
      <div class="contact-item"><div class="eyebrow">INSTAGRAM</div><a class="big" href="https://www.instagram.com/aluromero.atelier" target="_blank" rel="noopener">@aluromero.atelier</a></div>
      <div class="contact-item"><div class="eyebrow" data-i18n="contact.email"></div><a class="big" href="mailto:atelier@aluromero.com">atelier@aluromero.com</a></div>
      <div class="contact-item"><div class="eyebrow" data-i18n="contact.studio"></div><div class="big" style="border:none;padding-bottom:0;">Montréal, Québec</div></div>
    </div>
    <footer>
      <div>© 2026 Alu Romero Atelier</div>
      <div data-i18n="footer.tag"></div>
    </footer>
  </div>
</section>

<script>
const I18N = {
  fr: {
    'nav.work':'Œuvres','nav.process':'Technique','nav.about':"L'artiste",'nav.contact':'Contact',
    'hero.alt':'El Beso — étain repoussé à la main, Alu Romero',
    'hero.eyebrow':'ATELIER — MONTRÉAL, QUÉBEC',
    'hero.title':'La poésie<br>du <em>métal.</em>',
    'hero.sub':"Alu Romero repousse l'étain en feuille, à la main, pour en faire naître des reliefs : cœurs sacrés, corps et fleurs, millimètre par millimètre, depuis l'envers du métal.",
    'hero.scroll':'DÉFILER',
    'statement.quote':"Rien ici n'est coulé, rien n'est imprimé. Chaque relief est <span>poussé</span> vers la lumière, un passage d'outil à la fois.",
    'statement.cite':"— Notes d'atelier, Alu Romero",
    'work.eyebrow':'ŒUVRES CHOISIES','work.title':'Des pièces uniques, une seule technique.',
    'work.p':"Chaque panneau commence par une feuille d'étain plate. Ce qui suit est tiré du métal, jamais ajouté : figures, végétaux et formes votives, entièrement soulevés de l'intérieur.",
    'work.hint':'Survolez une œuvre pour la voir en situation',
    'process.eyebrow':'LA TECHNIQUE','process.title':"Le repoussé — travaillé entièrement depuis l'envers.",
    'process.p1':"Le repoussé est une technique d'ornementation du métal dont les racines remontent à plusieurs millénaires. La feuille est travaillée par l'arrière : le marteau et une famille d'outils à bout rond font monter le relief depuis l'envers, tandis que des outils plus fins précisent le détail sur l'endroit. Rien n'est retiré, rien n'est ajouté — l'image existe déjà dans la feuille plate, elle attend d'être poussée vers l'avant.",
    'process.p2':"Au Mexique, cette technique vit depuis longtemps dans l'art votif : cœurs sacrés, milagros et ex-voto travaillés dans l'étain. L'atelier d'Alu Romero porte cet héritage dans un registre contemporain — les mêmes outils à main, tournés vers le corps féminin, les fleurs et les formes du quotidien, puis montés sur bois de récupération, cadre ou miroir.",
    'tools.buril':'— trace et affine les lignes les plus fines','tools.perfilador':'— définit le contour de chaque forme','tools.esfumino':'— adoucit et fond la surface en relief','tools.wood_k':'Bois de récupération','tools.wood':'— le support des pièces faites pour vivre au mur',

// [id, title, mediumKey, art image, room image, span]
const PIECES = [
  ['el-beso','El Beso','medium.framed','images/el-beso-frame.jpg','images/el-beso-room.jpg','wide'],
  ['sagrado-corazon','Sagrado Corazón','medium.panel','images/sagrado-corazon.jpg','images/sagrado-corazon-room.jpg',''],
  ['corazon-anatomico','Corazón Anatómico','medium.beads','images/corazon-anatomico.jpg','images/corazon-anatomico-room.jpg',''],
  ['contemplacion','Contemplación','medium.wood','images/contemplacion.jpg','images/contemplacion-room.jpg',''],
  ['marea','Marea','medium.framed','images/marea.jpg','images/marea-room.jpg',''],
  ['corazon-floral','Corazón Floral','medium.panel','images/corazon-floral.jpg','images/corazon-floral-room.jpg',''],
  ['alcatraces','Alcatraces','medium.panel','images/alcatraces-room.jpg',null,''],
  ['sinfonia','Sinfonía Interior','medium.beads','images/sinfonia.jpg','images/sinfonia-room.jpg','wide'],
];

let lang = 'fr';
const gallery = document.getElementById('gallery');
PIECES.forEach((p,i) => {
  const [id,title,mk,art,room,span] = p;
  const el = document.createElement('div');
  el.className = 'piece' + (span?' '+span:'');
  el.dataset.mk = mk;
  el.innerHTML = `
    <img class="art" src="${art}" alt="${title}" loading="lazy">
    ${room ? `<img class="room" src="${room}" alt="${title}" loading="lazy">` : ''}
    <div class="hallmark">Nº&nbsp;${String(i+1).padStart(2,'0')}</div>
    <div class="scrim"></div>
    <div class="cap"><div class="title">${title}</div><div class="meta"></div></div>`;
  el.addEventListener('mouseenter', () => el.classList.add('in-situ'));
  el.addEventListener('mouseleave', () => el.classList.remove('in-situ'));
  el.addEventListener('click', () => el.classList.toggle('in-situ'));
  gallery.appendChild(el);
});

function applyLang(l){
  lang = l;
  const t = I18N[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] ?? ''; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml] ?? ''; });
  document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.alt = t[el.dataset.i18nAlt] ?? ''; });
  document.querySelectorAll('.piece').forEach(el => { el.querySelector('.meta').textContent = t[el.dataset.mk]; });
  document.querySelectorAll('.lang button').forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  document.title = l === 'fr' ? 'Alu Romero Atelier — La poésie du métal' : 'Alu Romero Atelier — La poesía del metal';
  history.replaceState(null,'', l === 'fr' ? location.pathname : location.pathname + '?lang=es');
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
const q = new URLSearchParams(location.search).get('lang');
applyLang(q === 'es' ? 'es' : 'fr');

// Nav on scroll
const nav = document.getElementById('nav');
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 40), {passive:true});

// Scroll reveal
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target);} }), {threshold:.14, rootMargin:'0px 0px -60px 0px'});
document.querySelectorAll('.piece, .reveal').forEach(el => io.observe(el));
</script>
